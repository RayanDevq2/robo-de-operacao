<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagas de edição de vídeo, todo dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEDEF;--panel:#F8F8F9;--ink:#161A22;--mute:#5B6270;--line:#D3D6DC;--br:#0E8F5B;--int:#2D5BFF;--new:#E5243B;--focus:#2D5BFF}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171A21;--panel:#20242D;--ink:#ECEDEF;--mute:#9AA1AE;--line:#343946;--br:#3BC48A;--int:#7F9BFF;--new:#FF5468;--focus:#7F9BFF}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
h1{font:800 clamp(2rem,6vw,3.4rem)/1.02 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 28px;max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
input[type=search]{flex:1 1 220px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mute);padding:10px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
label.chk{display:flex;gap:7px;align-items:center;color:var(--mute);cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.day{display:flex;align-items:center;gap:12px;margin:30px 0 10px;font:600 .95rem "Bricolage Grotesque",sans-serif}
.day::after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px)}
.day.today{color:var(--new)}
article{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--int);border-radius:4px 10px 10px 4px;margin-bottom:8px}
article.BR{border-left-color:var(--br)}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
summary::-webkit-details-marker{display:none}
.t{font:600 1.08rem/1.3 "Bricolage Grotesque",sans-serif}
.m{color:var(--mute);font-size:.92rem;grid-column:1}
.tag{grid-column:2;grid-row:1/3;align-self:center;font-size:.8rem;font-weight:500;color:var(--int)}
