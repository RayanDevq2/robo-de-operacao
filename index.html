<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagas de edição de vídeo, todo dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEDEF;--panel:#F8F8F9;--ink:#161A22;--mute:#5B6270;--line:#D3D6DC;--br:#0E8F5B;--int:#2D5BFF;--new:#E5243B;--focus:#2D5BFF}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171A21;--panel:#20242D;--ink:#ECEDEF;--mute:#9AA1AE;--line:#343946;--br:#3BC48A;--int:#7F9BFF;--new:#FF5468;--focus:#7F9BFF}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
h1{font:800 clamp(2rem,6vw,3.4rem)/1.02 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 28px;max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
input[type=search]{flex:1 1 220px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--mute);padding:10px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
label.chk{display:flex;gap:7px;align-items:center;color:var(--mute);cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.day{display:flex;align-items:center;gap:12px;margin:30px 0 10px;font:600 .95rem "Bricolage Grotesque",sans-serif}
.day::after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px)}
.day.today{color:var(--new)}
article{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--int);border-radius:4px 10px 10px 4px;margin-bottom:8px}
article.BR{border-left-color:var(--br)}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
summary::-webkit-details-marker{display:none}
.t{font:600 1.08rem/1.3 "Bricolage Grotesque",sans-serif}
.m{color:var(--mute);font-size:.92rem;grid-column:1}
.tag{grid-column:2;grid-row:1/3;align-self:center;font-size:.8rem;font-weight:500;color:var(--int)}
article.BR .tag{color:var(--br)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.body p{white-space:pre-line;margin:14px 0;max-width:68ch}
.apply{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:500}
.src{color:var(--mute);font-size:.85rem;margin-left:12px}
select{padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.niche{grid-column:1;justify-self:start;margin-top:4px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.82rem}
.best{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;margin-bottom:26px}
.best:empty{display:none}.bh{font:600 .9rem "Bricolage Grotesque",sans-serif;color:var(--new);margin-bottom:6px}
.best p{margin:10px 0 14px;max-width:62ch}
.empty{padding:40px 0;color:var(--mute)}
.wrap>.empty code{background:var(--panel);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Vagas de edição de vídeo</h1>
  <p class="sub" id="sub">Carregando vagas…</p>
  <section id="best"></section>
  <div class="controls">
    <input type="search" id="q" placeholder="Buscar por cargo, empresa ou palavra" aria-label="Buscar vagas">
    <div class="seg" role="group" aria-label="Região">
      <button data-r="" aria-pressed="true">Todas</button>
      <button data-r="BR" aria-pressed="false">Brasil</button>
      <button data-r="INT" aria-pressed="false">Internacional</button>
    </div>
    <select id="niche" aria-label="Nicho"><option value="">Todos os nichos</option></select>
    <label class="chk"><input type="checkbox" id="remote"> Só remotas</label>
  </div>
  <div id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const state={jobs:[],r:"",q:"",n:"",remote:false};
const fmt=new Intl.DateTimeFormat("pt-BR",{day:"numeric",month:"long"});
const dayKey=d=>d.toLocaleDateString("sv");
function dayLabel(d){
  const t=new Date(),y=new Date(Date.now()-864e5);
  if(dayKey(d)===dayKey(t))return"Hoje";
  if(dayKey(d)===dayKey(y))return"Ontem";
  return fmt.format(d);
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function render(){
  const q=state.q.toLowerCase(),list=$("#list");list.replaceChildren();
  const rows=state.jobs.filter(j=>(!state.r||j.region===state.r)&&(!state.n||(j.niche||"Geral")===state.n)&&(!state.remote||j.remote)&&
    (!q||(j.title+" "+j.company+" "+j.description+" "+j.location).toLowerCase().includes(q)));
  if(!rows.length){list.append(el("p","empty","Nenhuma vaga com esses filtros. Tire a busca ou troque a região."));return}
  let last="";
  for(const j of rows){
    const d=new Date(j.date),k=dayKey(d);
    if(k!==last){last=k;const h=el("div","day"+(dayLabel(d)==="Hoje"?" today":""),dayLabel(d));list.append(h)}
    const a=el("article",j.region),s=el("summary"),det=el("details");
    s.append(el("div","t",j.title),el("div","m",[j.company,j.location].filter(Boolean).join(" • ")+(j.remote?" • remoto":"")),
      el("span","niche",j.niche||"Geral"),el("div","tag",j.region==="BR"?"Brasil":"Internacional"));
    const b=el("div","body"),p=el("p",null,j.description||"Sem descrição. Veja a vaga completa no link."),
      ap=el("a","apply","Ver vaga e se candidatar");
    ap.href=j.url;ap.target="_blank";ap.rel="noopener noreferrer";
    b.append(p,ap,el("span","src","via "+j.source));
    det.append(s,b);a.append(det);list.append(a);
  }
}
function showBest(b){
  const j=b&&state.jobs.find(x=>x.id===b.id);if(!j)return;
  const s=$("#best"),a=el("a","apply","Ver vaga e se candidatar");
  a.href=j.url;a.target="_blank";a.rel="noopener noreferrer";
  s.append(el("div","bh",b.by==="ia"?"Vaga do dia, escolhida pela IA":"Vaga do dia"),el("div","t",j.title),
    el("div","m",[j.company,j.location,j.niche||"Geral"].filter(Boolean).join(" • ")),el("p",null,b.motivo),a);
}
async function init(){
  try{
    const data=await (await fetch("data/jobs.json",{cache:"no-store"})).json();
    state.jobs=data.jobs||[];
    [...new Set(state.jobs.map(j=>j.niche||"Geral"))].sort().forEach(n=>{const o=el("option",null,n);o.value=n;$("#niche").append(o)});
    showBest(data.best);
    const n=state.jobs.length,br=state.jobs.filter(j=>j.region==="BR").length;
    if(!n){$("#sub").textContent="Ainda não há vagas. Rode o script scripts/fetch_jobs.py ou aguarde a primeira atualização automática.";return}
    const up=new Date(data.updated);
    $("#sub").textContent=`${n} vagas dos últimos 30 dias (${br} no Brasil, ${n-br} internacionais). Atualizado em ${up.toLocaleString("pt-BR",{dateStyle:"long",timeStyle:"short"})}.`;
    render();
  }catch(e){$("#sub").textContent="Não foi possível carregar data/jobs.json. Abra o site por um servidor (por exemplo, python -m http.server) ou pelo GitHub Pages."}
}
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#niche").addEventListener("change",e=>{state.n=e.target.value;render()});
$("#remote").addEventListener("change",e=>{state.remote=e.target.checked;render()});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  state.r=b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()}));
init();
</script>
</body>
</html>
